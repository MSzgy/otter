[project]
name = "otter-assistant"
version = "0.0.1"
description = "🦦 Otter — 私人 Mac 工作助理:采集每日工作痕迹,LLM 生成简报"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guoyang Zou", email = "guoyang.zou@sap.com" }]

dependencies = [
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "keyring>=25.0.0",
    "langgraph>=1.2.11",
    "msal>=1.31.0",
    "pydantic>=2.6.0",
    "python-dateutil>=2.9.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "freezegun>=1.5.0",
    "ruff>=0.6.0",
]
desktop-build = [
    "pyinstaller>=6,<7",
]

[project.scripts]
otter = "otter.cli:app"

# ───────────── Otter 插件扩展点 ─────────────
# 所有内建实现和第三方插件都通过 entry_points 注册。
# 注:每个 provider 在其 Day 落地时才加进来,避免 `otter plugins list` 显示
# 未实现的名字。
[project.entry-points."otter.collectors"]
git = "otter.collectors.git_local:GitLocalCollector"
github = "otter.collectors.github:GitHubCollector"
outlook = "otter.collectors.outlook:OutlookCollector"

[project.entry-points."otter.llm"]
claude = "otter.llm.claude:ClaudeProvider"
mock = "otter.llm.mock:MockProvider"

[project.entry-points."otter.enrichers"]
# 后续填充

[project.entry-points."otter.notifiers"]
file = "otter.notifiers.file:FileNotifier"
stdout = "otter.notifiers.stdout:StdoutNotifier"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
